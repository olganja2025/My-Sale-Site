name: Cleanup static lead forms
on:
  push:
    branches: [pricing-copy-og-fixes]
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[forms-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pricing-copy-og-fixes
      - name: Replace forms with Telegram CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          telegram='https://t.me/olganja'
          labels={
            'index.html':'Написать Ольге',
            'call-center/index.html':'Обсудить прозвон',
            'amocrm/index.html':'Обсудить amoCRM',
            'external-rop/index.html':'Обсудить внешний РОП',
            'sales-audit/index.html':'Обсудить аудит',
            'sales-department/index.html':'Обсудить отдел продаж',
            'prices/index.html':'Написать Ольге',
          }

          for rel,label in labels.items():
              p=Path(rel)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              cta=(f'<div class="telegram-contact"><a class="button button-primary telegram-cta" '
                   f'href="{telegram}" target="_blank" rel="noopener noreferrer">{label}</a>'
                   f'<p class="telegram-note">Откроется диалог с Ольгой в Telegram.</p></div>')
              s=re.sub(r'<form class="contact-form"[^>]*>.*?</form>',cta,s,flags=re.S)
              s=re.sub(r'<a class="([^"]*button[^"]*)" href="(?:\.\./)?#contact">[^<]*</a>',
                       lambda m:f'<a class="{m.group(1)}" href="{telegram}" target="_blank" rel="noopener noreferrer">{label}</a>',s)
              if 'legal-placeholder' not in s:
                  s=re.sub(r'(<footer class="footer"><div class="container footer-row">.*?)(</div></footer>)',
                           r'\1<span class="legal-placeholder">Правовая информация — будет добавлена после определения юридического оператора</span>\2',s,flags=re.S)
              p.write_text(s,encoding='utf-8')

          wf=Path('.github/workflows/cleanup-forms.yml')
          if wf.exists():
              wf.unlink()
          PY
      - name: Commit cleaned HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[forms-cleanup] Remove lead forms and use Telegram CTA" || exit 0
          git push origin HEAD:pricing-copy-og-fixes
