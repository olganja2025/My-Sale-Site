name: Apply ALSTER brand naming

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace public brand naming
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          patterns = ('*.html', '*.js', '*.css')
          replacements = [
              ('ALSTER SERVICES', 'ALSTER'),
              ('Alster Services', 'ALSTER'),
              ('alster services', 'ALSTER'),
          ]

          for pattern in patterns:
              for path in root.rglob(pattern):
                  if '.git' in path.parts:
                      continue
                  text = path.read_text(encoding='utf-8')
                  new = text
                  for old, repl in replacements:
                      new = new.replace(old, repl)
                  new = new.replace('Системы продаж для бизнеса', 'Системные продажи для бизнеса')
                  if new != text:
                      path.write_text(new, encoding='utf-8')

          # Verify visible/site source contains no legacy public brand name.
          offenders = []
          for pattern in patterns:
              for path in root.rglob(pattern):
                  if '.git' in path.parts:
                      continue
                  text = path.read_text(encoding='utf-8')
                  if re.search(r'alster\s+services', text, flags=re.I):
                      offenders.append(str(path))
          if offenders:
              raise SystemExit('Legacy brand remains in: ' + ', '.join(offenders))

          # Existing project rules must still hold.
          em_dash = []
          max_hits = []
          for pattern in patterns:
              for path in root.rglob(pattern):
                  if '.git' in path.parts:
                      continue
                  text = path.read_text(encoding='utf-8')
                  if '—' in text:
                      em_dash.append(str(path))
                  if pattern in ('*.html', '*.js') and re.search(r'(?<![A-Za-zА-Яа-я])MAX(?![A-Za-zА-Яа-я])', text):
                      max_hits.append(str(path))
          if em_dash:
              raise SystemExit('Em dash remains: ' + ', '.join(em_dash))
          if max_hits:
              raise SystemExit('MAX remains: ' + ', '.join(max_hits))
          PY
      - name: Commit brand migration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename public brand to ALSTER"
          git push
