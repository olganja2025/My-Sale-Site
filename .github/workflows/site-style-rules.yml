name: Enforce site text rules

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize punctuation and mobile cards
        run: |
          python - <<'PY'
          from pathlib import Path

          # Permanent project rule: no em dashes in site text/source.
          for pattern in ('*.html', '*.js'):
              for path in Path('.').rglob(pattern):
                  text = path.read_text(encoding='utf-8')
                  new = text.replace('—', '-')
                  if new != text:
                      path.write_text(new, encoding='utf-8')

          # Homepage mobile task cards must always show the full approved text.
          css_path = Path('refinements.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* full mobile task-card text */'
          if marker not in css:
              css += "\n" + marker + "\n" + "@media(max-width:640px){.task-card{height:auto!important;max-height:none!important;min-height:0!important;overflow:visible!important}.task-card p{display:block!important;overflow:visible!important;max-height:none!important;height:auto!important;white-space:normal!important;text-overflow:clip!important;-webkit-line-clamp:unset!important;line-clamp:unset!important;-webkit-box-orient:initial!important}.task-card .task-link{position:static!important;margin-top:20px!important}}\n"
              css_path.write_text(css, encoding='utf-8')
          PY
      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply site text rules"
          git push
