name: Enforce site text rules

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: python -m pip install --quiet pillow
      - name: Apply technical site rules
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          root = Path('.')

          # Permanent rule: no em dashes in visible site source.
          for pattern in ('*.html', '*.js', '*.css'):
              for path in root.rglob(pattern):
                  if '.git' in path.parts:
                      continue
                  text = path.read_text(encoding='utf-8')
                  text = text.replace('—', '-')
                  path.write_text(text, encoding='utf-8')

          # Shared navigation CSS + mobile card safety.
          css_path = Path('refinements.css')
          css = css_path.read_text(encoding='utf-8')
          if '/* full mobile task-card text */' not in css:
              css += '\n/* full mobile task-card text */\n@media(max-width:640px){.task-card{height:auto!important;max-height:none!important;min-height:0!important;overflow:visible!important}.task-card p{display:block!important;overflow:visible!important;max-height:none!important;height:auto!important;white-space:normal!important;text-overflow:clip!important;-webkit-line-clamp:unset!important;line-clamp:unset!important;-webkit-box-orient:initial!important}.task-card .task-link{position:static!important;margin-top:20px!important}}\n'
          if '/* unified site navigation */' not in css:
              css += '\n/* unified site navigation */\n.mobile-service-menu{border:0}.mobile-service-menu summary{cursor:pointer;font-weight:700;list-style:none;padding:12px 0}.mobile-service-menu summary::-webkit-details-marker{display:none}.mobile-service-menu summary:after{content:" +"}.mobile-service-menu[open] summary:after{content:" -"}.mobile-service-links{display:grid;gap:2px;padding:0 0 8px 14px}.mobile-service-links a{padding:9px 0!important}.service-crosslink{margin-top:26px;padding:18px 20px;border:1px solid rgba(83,105,91,.22);border-radius:14px;background:rgba(239,237,229,.55)}.service-crosslink small{display:block;margin-bottom:6px;color:var(--muted);font-size:12px}.service-crosslink a{font-weight:800;color:var(--green);text-decoration:none}.service-crosslink a:hover{text-decoration:underline}@media(max-width:640px){.service-crosslink{padding:16px;margin-top:20px}}\n'
          css_path.write_text(css, encoding='utf-8')

          services = [
              ('sales-department/', 'Система продаж с нуля'),
              ('sales-department-improvement/', 'Доработка отдела продаж'),
              ('external-rop/', 'Сопровождение отдела продаж (внешний РОП)'),
              ('sales-audit/', 'Аудит отдела продаж'),
              ('call-center/', 'Прозвон / колл-центр'),
              ('amocrm/', 'Внедрение и настройка amoCRM'),
          ]

          def prefix_for(path: Path):
              return '' if path.parent == Path('.') else '../'

          def desktop_nav(prefix, include_cases=True):
              links = ''.join(f'<a href="{prefix}{href}"><strong>{label}</strong></a>' for href, label in services)
              cases = f'<a href="{prefix}#cases">Проекты из практики</a>' if include_cases else ''
              return f'<nav class="nav"><div class="nav-dropdown"><button class="nav-dropbtn" type="button">Услуги ▾</button><div class="nav-dropdown-menu">{links}</div></div>{cases}<a href="{prefix}prices/">Цены</a><a href="{prefix}#about">О нас</a></nav>'

          def mobile_nav(prefix):
              links = ''.join(f'<a href="{prefix}{href}">{label}</a>' for href, label in services)
              return f'<div class="mobile-nav" hidden><details class="mobile-service-menu"><summary>Услуги</summary><div class="mobile-service-links">{links}</div></details><a href="{prefix}prices/">Цены</a><a href="{prefix}#about">О компании</a><a href="https://t.me/olganja" target="_blank" rel="noopener noreferrer">Telegram</a></div>'

          active_pages = [
              Path('index.html'), Path('404.html'), Path('prices/index.html'),
              Path('call-center/index.html'), Path('amocrm/index.html'),
              Path('external-rop/index.html'), Path('sales-audit/index.html'),
              Path('sales-department/index.html'), Path('sales-department-improvement/index.html')
          ]

          for page in active_pages:
              if not page.exists():
                  continue
              text = page.read_text(encoding='utf-8')
              prefix = prefix_for(page)
              text = re.sub(r'<nav class="nav">.*?</nav>', desktop_nav(prefix, include_cases=page != Path('index.html')), text, count=1, flags=re.S)
              text = re.sub(r'<div class="mobile-nav"[^>]*>.*?(?=</header>)', mobile_nav(prefix), text, count=1, flags=re.S)
              page.write_text(text, encoding='utf-8')

          # External ROP: useful path to improvement + prices in footer.
          rop = Path('external-rop/index.html')
          if rop.exists():
              text = rop.read_text(encoding='utf-8')
              if 'rop-improvement-crosslink' not in text:
                  block = '<section class="section section-soft rop-improvement-crosslink"><div class="container"><div class="service-crosslink"><small>Если аудит покажет, что отдел сначала нужно привести в рабочее состояние</small><a href="../sales-department-improvement/">Доработка отдела продаж</a></div></div></section>'
                  marker = '<section class="section contact-section"'
                  text = text.replace(marker, block + marker, 1)
              footer_match = re.search(r'(<footer class="footer">.*?</footer>)', text, flags=re.S)
              if footer_match and 'href="../prices/"' not in footer_match.group(1):
                  footer = footer_match.group(1).replace('</div></footer>', '<a href="../prices/">Цены</a></div></footer>')
                  text = text[:footer_match.start()] + footer + text[footer_match.end():]
              rop.write_text(text, encoding='utf-8')

          # Sitemap entry for the new service.
          sitemap = Path('sitemap.xml')
          if sitemap.exists():
              sm = sitemap.read_text(encoding='utf-8')
              entry = '  <url><loc>https://services.alster-os.ru/sales-department-improvement/</loc></url>\n'
              if 'sales-department-improvement/' not in sm:
                  sm = sm.replace('</urlset>', entry + '</urlset>')
              sitemap.write_text(sm, encoding='utf-8')

          # Compress Olga's portrait without changing its public path.
          portrait = Path('assets/images/olga-nesina.png')
          if portrait.exists():
              with Image.open(portrait) as im:
                  im = im.convert('RGBA') if im.mode in ('RGBA', 'LA', 'P') else im.convert('RGB')
                  if max(im.size) > 1200:
                      im.thumbnail((1200, 1200), Image.Resampling.LANCZOS)
                  im.save(portrait, format='PNG', optimize=True, compress_level=9)

          # Safety checks.
          em_dash = []
          max_hits = []
          bad_cta = []
          for pattern in ('*.html', '*.js', '*.css'):
              for path in root.rglob(pattern):
                  if '.git' in path.parts:
                      continue
                  text = path.read_text(encoding='utf-8')
                  if '—' in text:
                      em_dash.append(str(path))
                  if pattern in ('*.html', '*.js') and re.search(r'(?<![A-Za-zА-Яа-я])MAX(?![A-Za-zА-Яа-я])', text):
                      max_hits.append(str(path))
                  if pattern == '*.html':
                      for m in re.finditer(r'<a\b([^>]*class="[^"]*button[^"]*"[^>]*)>', text, flags=re.I):
                          href = re.search(r'href="([^"]*)"', m.group(1), flags=re.I)
                          if not href or not href.group(1).strip():
                              bad_cta.append(str(path))
          if em_dash:
              raise SystemExit('Em dash remains: ' + ', '.join(em_dash))
          if max_hits:
              raise SystemExit('MAX remains: ' + ', '.join(max_hits))
          if bad_cta:
              raise SystemExit('CTA without href: ' + ', '.join(sorted(set(bad_cta))))
          PY
      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply technical site rules"
          git push
