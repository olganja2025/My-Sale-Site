name: Finish form cleanup
on:
  push:
    branches: [pricing-copy-og-fixes]
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[forms-cleanup-2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pricing-copy-og-fixes
      - name: Remove remaining forms
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          telegram='https://t.me/olganja'
          labels={
            'index.html':'Написать Ольге',
            'call-center/index.html':'Обсудить прозвон',
            'amocrm/index.html':'Обсудить amoCRM',
            'external-rop/index.html':'Обсудить внешний РОП',
            'sales-audit/index.html':'Обсудить аудит',
            'sales-department/index.html':'Обсудить отдел продаж',
          }
          for rel,label in labels.items():
              p=Path(rel)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              cta=(f'<div class="telegram-contact"><a class="button button-primary telegram-cta" href="{telegram}" target="_blank" rel="noopener noreferrer">{label}</a><p class="telegram-note">Откроется диалог с Ольгой в Telegram.</p></div>')
              s=re.sub(r'<form\b[^>]*class="[^"]*\bcontact-form\b[^"]*"[^>]*>.*?</form>',cta,s,flags=re.S)
              s=s.replace('href="#contact">Контакты</a>',f'href="{telegram}" target="_blank" rel="noopener noreferrer">Написать Ольге</a>')
              p.write_text(s,encoding='utf-8')
          Path('.github/workflows/cleanup-forms-2.yml').unlink(missing_ok=True)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[forms-cleanup-2] Remove remaining form markup" || exit 0
          git push origin HEAD:pricing-copy-og-fixes
